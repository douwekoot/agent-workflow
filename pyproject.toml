[project]
name = "agent-workflow"
version = "0.1.0"
description = "MCP server that coordinates multi-role agent runs: tasks, context packets, gates and a token ledger"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
agent-workflow-mcp = "agent_workflow.server:main"
agent-workflow-drive = "agent_workflow.driver:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_workflow"]

[tool.setuptools.package-data]
agent_workflow = ["prompts/*.md"]
